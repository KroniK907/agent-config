name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/wizard/src/go.mod
      - name: Validate catalog.json
        run: go run scripts/validate-catalog/main.go
      - name: Test agent-config-wizard
        run: go test -C scripts/wizard/src ./...
      - name: Verify agent-config-wizard builds (linux)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -C scripts/wizard/src -o /tmp/agent-config-wizard .
      - name: Verify agent-config-wizard builds (windows)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -C scripts/wizard/src -o /tmp/agent-config-wizard.exe .

  publish-wizard-binaries:
    needs: validate-catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/wizard/src/go.mod
      - name: Build agent-config-wizard (linux)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -C scripts/wizard/src -o ../bin/agent-config-wizard .
      - name: Build agent-config-wizard (windows)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -C scripts/wizard/src -o ../bin/agent-config-wizard.exe .
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-config-wizard
          path: |
            scripts/wizard/bin/agent-config-wizard
            scripts/wizard/bin/agent-config-wizard.exe
          if-no-files-found: error
      - name: Commit and push binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wizard/bin/agent-config-wizard scripts/wizard/bin/agent-config-wizard.exe
          if git diff --staged --quiet; then
            echo "Binaries unchanged; nothing to commit."
          else
            git commit -m "ci: update agent-config-wizard binaries"
            git push
          fi

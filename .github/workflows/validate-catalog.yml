name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Validate catalog.json
        run: go run scripts/validate-catalog/main.go
